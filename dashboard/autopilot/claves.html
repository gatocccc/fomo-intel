<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopilot · Claves</title>
<style>
body{margin:0;background:#E8EEEF;color:#123236;font:16px/1.5 system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;margin:0 0 6px}p{color:#4A6E6D;margin:0 0 24px}
.k{background:#F6F8F8;border-radius:16px;padding:16px;margin-bottom:12px}
.k b{display:block}.k small{color:#4A6E6D}
.row{display:flex;gap:8px;margin-top:10px}
input{flex:1;font:inherit;padding:10px 12px;border:2px solid #C7D3D4;border-radius:10px}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:99px;border:0;background:#123236;color:#fff;cursor:pointer}
.ok{color:#2E9B5F;font-weight:700}.no{color:#CF4A3A}
</style></head><body><div class="w">
<h1>Claves del piloto automático</h1>
<p>Pegá cada clave acá. Se guarda directo en el servidor; no queda en el chat ni en GitHub, y esta página nunca la vuelve a mostrar.</p>
<div id="l">Cargando…</div></div>
<script>
const api = "/app-api/admin/claves";
function draw(d){
  const l = document.getElementById("l"); l.innerHTML = "";
  d.claves.forEach(c => {
    const div = document.createElement("div"); div.className = "k";
    div.innerHTML = `<b></b><small></small> <span class="${c.cargada ? "ok" : "no"}">${c.cargada ? "Cargada" : "Falta"}</span>
      <div class="row"><input type="password" autocomplete="off" aria-label="valor"><button type="button">Guardar</button></div>`;
    div.querySelector("b").textContent = c.descripcion; div.querySelector("small").textContent = c.nombre;
    const inp = div.querySelector("input");
    div.querySelector("button").onclick = () => fetch(api, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({nombre: c.nombre, valor: inp.value})}).then(r => r.json()).then(x => x.error ? alert(x.error) : draw(x));
    l.appendChild(div);
  });
}
fetch(api).then(r => r.json()).then(draw).catch(() => document.getElementById("l").textContent = "No se pudo cargar.");
</script></body></html>
